repos:
  - repo: local
    hooks:
      - id: code-quality-gate
        name: Auto docstring + PEP257 + Coverage
        entry: python -m code_quality_tool.quality_gate
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        exclude: ^(?:pep257_fixer\.py|pep257_checker\.py|auto_docstring_generator\.py|analyzer\.py|run_quality_gate\.py|pyproject\.toml)$
